# ─── 4/5  Deploy prod: manual, reviewed, and "what you approve is what runs" ─
#
#   Run workflow (main only)
#     job "plan"   plan identity (read-only) ─▶ plan ─▶ OPA ─▶ summary + fingerprint
#          │
#          ▼  ⏸  environment "prod": a required reviewer reads the plan and approves
#     job "deploy" prod identity ─▶ re-plan ─▶ fingerprint must MATCH ─▶ OPA ─▶ apply
#                                 ─▶ build/push/deploy by digest ─▶ smoke test
#
# The fingerprint = the list of (resource address, action) the reviewer saw.
# If anything changed between approval and apply, the job refuses to apply.
name: deploy-prod

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  ENV_NAME: prod
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS_plan: "-lock-timeout=10m"
  TF_CLI_ARGS_apply: "-lock-timeout=10m"

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # subject "ref:refs/heads/main" ─▶ read-only plan identity
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Mask deployment identifiers in logs (public repo)
        run: |
          echo "::add-mask::${ARM_SUBSCRIPTION_ID}"
          echo "::add-mask::${ARM_TENANT_ID}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.21.0"
      - run: make plan ENV="$ENV_NAME"
      - run: make policy-plan ENV="$ENV_NAME"
      - name: Plan for the reviewer (job summary) + fingerprint
        id: fp
        run: |
          fp=$(scripts/plan-fingerprint.sh "$ENV_NAME")
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          {
            echo "### prod plan - review before approving"
            echo "Fingerprint: \`$fp\`"
            echo '```'
            terraform -chdir="infra/envs/$ENV_NAME" show -no-color tfplan \
              | sed -e "s/${ARM_SUBSCRIPTION_ID}/***/g" -e "s/${ARM_TENANT_ID}/***/g" | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: plan
    runs-on: ubuntu-24.04
    environment: prod # ⏸ required reviewers + main-only branch policy
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # subject "environment:prod" ─▶ prod deploy identity
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - name: Mask deployment identifiers in logs (public repo)
        run: |
          echo "::add-mask::${ARM_SUBSCRIPTION_ID}"
          echo "::add-mask::${ARM_TENANT_ID}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.21.0"
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - run: make plan ENV="$ENV_NAME"
      - name: Refuse if the plan changed since approval
        env:
          APPROVED: ${{ needs.plan.outputs.fingerprint }}
        run: |
          now=$(scripts/plan-fingerprint.sh "$ENV_NAME")
          echo "approved=$APPROVED current=$now"
          [ "$now" = "$APPROVED" ] || { echo "::error::Plan differs from the approved plan - re-run the workflow."; exit 1; }
      - run: make policy-plan ENV="$ENV_NAME"
      - run: make apply ENV="$ENV_NAME"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: make deploy-app ENV="$ENV_NAME"
      - run: make smoke-test ENV="$ENV_NAME"
