# The app's "badge". Workload identity exchanges this ServiceAccount's
# short-lived token for an Entra token of the managed identity named in the
# annotation - and ONLY this ServiceAccount in THIS cluster can do so (the
# federated credential pins issuer + subject, see infra/modules/aks).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundry-app
  namespace: ai-app
  annotations:
    # Filled in per environment from `terraform output app_identity_client_id`.
    azure.workload.identity/client-id: PLACEHOLDER_CLIENT_ID
# No Kubernetes API token is mounted: the app never talks to the Kubernetes
# API. (The workload identity webhook projects its own, Azure-audience token.)
automountServiceAccountToken: false
